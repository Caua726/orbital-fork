<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050812" />
  <!-- Inline favicon (data URI) — a small orbital glyph. Avoids the
       /favicon.ico 404 the browser auto-requests, with no extra HTTP hit. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050812'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffd166'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5' fill='none' stroke='%238aa4bd' stroke-width='1.5' transform='rotate(-20 16 16)'/%3E%3C/svg%3E" />
  <title>Orbital Wydra</title>
</head>
<body style="margin:0;background:#000">
  <canvas id="weydra-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0;"></canvas>
  <div id="app"></div>
  <script>
    // Render lab (public/render-lab/): `?lab=1&seed=N` seeds Math.random
    // before any game code runs, so two engines side by side generate the
    // same world (same PRNG as tests/render-matrix.mjs).
    (function () {
      var sp = new URLSearchParams(location.search);
      if (sp.get('lab') !== '1' || !sp.get('seed')) return;
      var s = Number(sp.get('seed')) >>> 0;
      Math.random = function () {
        s = (s + 0x6d2b79f5) >>> 0;
        var t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
